app = "alversjo-platform"
primary_region = "arn"
kill_timeout = "30s"

[build]

[deploy]
  # Applies pending Drizzle migrations before the new version takes traffic.
  release_command = "npx tsx src/db/migrate.ts"

[env]
  PORT = "8080"
  PLATFORM_URL = "https://members.alversjo.land"
  BOXES_DOMAIN = "boxes.alversjo.land"
  COOKIE_DOMAIN = "alversjo.land"
  FLY_BOXES_APP = "alversjo-boxes"
  BOX_IMAGE = "registry.fly.io/alversjo-boxes:latest"
  # Real Stripe Price IDs, not secret but not yet known to this box — whoever has access to the
  # Stripe dashboard must fill these in before checkout/payments will work.
  STRIPE_PRICE_YEARLY = ""
  STRIPE_PRICE_MONTHLY = ""
  STRIPE_PRICE_ONE_TIME = ""
  EMAIL_FROM = "Alversjö <no-reply@notifications.alversjo.land>"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
